<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d"><title id="t">A teachable heart before God</title><desc id="d">A person kneels in quiet prayer as golden morning light enters through an arched window, representing repentance and renewed direction.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1a2d34"/><stop offset="1" stop-color="#526b61"/></linearGradient><linearGradient id="light" x2="0" y2="1"><stop stop-color="#fff0bf" stop-opacity=".85"/><stop offset="1" stop-color="#e4c27e" stop-opacity="0"/></linearGradient><linearGradient id="robe" x2="1" y2="1"><stop stop-color="#e2d9c5"/><stop offset="1" stop-color="#9da99b"/></linearGradient></defs><rect width="900" height="560" rx="26" fill="url(#bg)"/><path d="M600 55 Q600 15 650 15 H760 Q810 15 810 55 V285 H600Z" fill="#0f2026" stroke="#c7a76b" stroke-width="10"/><path d="M620 62 Q620 35 650 35 H760 Q790 35 790 62 V275 H620Z" fill="#e9d6a0"/><path d="M640 55 L770 255 H640Z" fill="#fff5cf" opacity=".65"/><path d="M635 270 L430 500 L760 500 L780 270Z" fill="url(#light)"/><path d="M0 450 Q250 420 450 450 T900 435 V560 H0Z" fill="#101d22" opacity=".75"/><g transform="translate(180 180)"><circle cx="170" cy="65" r="42" fill="#c68e6a"/><path d="M130 68 Q123 15 172 18 Q211 24 209 71 L191 51 L155 47Z" fill="#2b2b28"/><path d="M110 120 Q151 92 194 123 L230 205 L190 250 L90 250 L70 205Z" fill="url(#robe)"/><path d="M90 240 Q130 220 158 240 L190 290 L132 322 L62 286Z" fill="#b6b7a6"/><path d="M190 245 Q225 265 240 295" stroke="#c68e6a" stroke-width="18" fill="none" stroke-linecap="round"/><path d="M142 118 L170 168 L198 118" fill="none" stroke="#a77d42" stroke-width="5"/><path d="M80 310 Q150 330 220 302" fill="none" stroke="#d8cba8" stroke-width="4" opacity=".8"/></g><path d="M420 390 Q455 360 480 375" stroke="#e7d39d" stroke-width="3" fill="none" opacity=".7"/><text x="55" y="70" font-family="Georgia,serif" font-size="19" letter-spacing="4" fill="#e6cf98">A HEART THAT CAN GROW</text><text x="55" y="505" font-family="Georgia,serif" font-size="28" fill="#f4efe2">Humility makes room for change.</text></svg>